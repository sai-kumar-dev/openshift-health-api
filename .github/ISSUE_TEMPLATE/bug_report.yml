name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, requests, configuration, and relevant logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.3.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local Python
        - Podman or Docker
        - Kubernetes
        - OpenShift
        - Other
    validations:
      required: true
