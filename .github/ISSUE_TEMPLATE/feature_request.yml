name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering or user problem should be solved?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and trade-offs
    validations: {required: true}
